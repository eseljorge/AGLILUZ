name: Automatizacion Licitaciones Mercado Publico

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        env:
          TICKET_MP: ${{ secrets.TICKET_MP }}
        run: |
          python main.py

      - name: Commit and push updated Excel reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add agliluz/historial_licitaciones.xlsx
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización automática de reportes [skip ci]" && git push)
