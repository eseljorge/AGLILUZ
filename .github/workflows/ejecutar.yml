name: Automatizacion Licitaciones Mercado Publico

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run script
        env:
          TICKET_MP: ${{ secrets.TICKET_MP }}
        run: |
          python main.py

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: reporte-licitaciones
          path: agliluz/
