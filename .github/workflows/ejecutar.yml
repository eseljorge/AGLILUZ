name: Automatizacion Licitaciones Mercado Publico

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies and Playwright browsers
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run script
        env:
          TICKET_MP: ${{ secrets.TICKET_MP }}
        run: |
          python main.py

      - name: Commit and push updated Excel reports
        run: |
          git config --global user.name "AgliLuz Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add agliluz/*.xlsx
          git diff --quiet && git diff --staged --quiet || git commit -m "Actualización automática de reportes y telegestión [skip ci]"
          git push

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: reporte-licitaciones
          path: agliluz/
